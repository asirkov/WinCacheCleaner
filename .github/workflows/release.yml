name: Validate and release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Check syntax and version
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'WinCacheCleaner.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          $version = (Get-Content VERSION -Raw).Trim()
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'VERSION must be MAJOR.MINOR.PATCH' }
          $actual = & ./WinCacheCleaner.ps1 -Version
          if ($actual -cne $version) { throw 'Script version differs from VERSION' }
      - name: Run isolated safety tests
        shell: ${{ matrix.shell }}
        run: ./tests/Safety.Tests.ps1

  release:
    name: Publish versioned release
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v${version}"
          # Never overwrite a published version or move an existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; bump VERSION and AppVersion for the next release."
            exit 0
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          mkdir -p dist
          cp WinCacheCleaner.ps1 README.md LICENSE CHANGELOG.md VERSION dist/
          (cd dist && sha256sum WinCacheCleaner.ps1 > SHA256SUMS.txt)
          (cd dist && zip -q "../WinCacheCleaner-${tag}.zip" WinCacheCleaner.ps1 README.md LICENSE CHANGELOG.md VERSION SHA256SUMS.txt)
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WinCacheCleaner ${tag}" \
            --generate-notes \
            dist/WinCacheCleaner.ps1 dist/SHA256SUMS.txt "WinCacheCleaner-${tag}.zip"
