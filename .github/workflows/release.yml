name: Validate and release
run-name: Validate and release (${{ github.ref_name }}, ${{ github.event_name }})

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  commits:
    name: Check Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate commit messages
        shell: bash
        env:
          COMMITLINT_HEAD: ${{ github.sha }}
        run: ./ci/check-commits

  validate:
    name: Validate (${{ matrix.os }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: pwsh
          - os: windows-latest
            engine: pwsh
          - os: windows-latest
            engine: powershell.exe
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and tests
        shell: bash
        env:
          POWERSHELL: ${{ matrix.engine }}
        run: ./ci/validate

  package:
    name: Build and test Windows CMD
    needs: [commits, validate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build standalone CMD and ZIP
        shell: bash
        run: ./ci/build
      - name: Test release payload and actual Windows CMD launch
        shell: bash
        run: ./ci/test-package
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned release
    needs: [commits, validate, package]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Publish version or refresh release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: ./ci/release
