name: Validate and release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }}, ${{ matrix.engine }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            engine: pwsh
          - os: windows-latest
            engine: pwsh
          - os: windows-latest
            engine: powershell.exe
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and tests
        shell: bash
        env:
          POWERSHELL: ${{ matrix.engine }}
        run: ./ci/validate

  package:
    name: Build and test Windows CMD
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build standalone CMD and ZIP
        shell: bash
        run: ./ci/build
      - name: Test release payload and actual Windows CMD launch
        shell: bash
        run: ./ci/test-package
      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish versioned release
    needs: [validate, package]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist
      - name: Publish new version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: ./ci/release
