name: Validate and release

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    steps:
      - uses: actions/checkout@v4
      - name: Validate with PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./.github/scripts/Validate.ps1
      - name: Validate with Windows PowerShell 5.1
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./.github/scripts/Validate.ps1

  release:
    name: Publish versioned release
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create release if this version is new
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          tag="v${version}"
          # Never overwrite a published version or move an existing tag.
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null; then
            echo "${tag} already exists; bump VERSION and AppVersion for the next release."
            exit 0
          else
            status=$?
            if [ "$status" -ne 2 ]; then exit "$status"; fi
          fi
          mkdir -p dist
          cp WinCacheCleaner.ps1 README.md LICENSE CHANGELOG.md VERSION dist/
          (cd dist && sha256sum WinCacheCleaner.ps1 > SHA256SUMS.txt)
          (cd dist && zip -q "../WinCacheCleaner-${tag}.zip" WinCacheCleaner.ps1 README.md LICENSE CHANGELOG.md VERSION SHA256SUMS.txt)
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "WinCacheCleaner ${tag}" \
            --generate-notes \
            dist/WinCacheCleaner.ps1 dist/SHA256SUMS.txt "WinCacheCleaner-${tag}.zip"
